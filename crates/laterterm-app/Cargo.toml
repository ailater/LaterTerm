[package]
name = "laterterm-app"
description = "LaterTerm 终端主程序"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[[bin]]
name = "laterterm"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
laterterm-termview = { path = "../laterterm-termview" }
laterterm-config = { path = "../laterterm-config" }
laterterm-core.workspace = true
laterterm-local.workspace = true
laterterm-secrets.workspace = true
laterterm-ssh = { path = "../laterterm-ssh" }
anyhow.workspace = true
parking_lot.workspace = true
flume.workspace = true
notify = "8"
# 触发器正则（regex::bytes 应对非 UTF-8 安全的 PTY 字节流）：workspace 已声明
# （lock 已含 1.13.1），termview 同链入二进制，此处引用零新增 crate。
regex.workspace = true
laterterm-xshell.workspace = true
shellexpand = "3.1.2"
laterterm-transfer.workspace = true
serde_json.workspace = true
ureq.workspace = true

# Quake 全局热键（portal worker）仅 Linux：ashpd feature 并集由 workspace 声明补齐
# （default-features=false + async-std，与 gpui 一致），async-io 供独立线程 block_on。
[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
async-io.workspace = true
futures-lite.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
