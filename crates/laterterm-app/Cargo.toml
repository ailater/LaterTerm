[package]
name = "laterterm-app"
description = "LaterTerm 终端主程序"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[[bin]]
name = "laterterm"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
laterterm-termview = { path = "../laterterm-termview" }
laterterm-config = { path = "../laterterm-config" }
laterterm-core.workspace = true
laterterm-local.workspace = true
laterterm-secrets.workspace = true
laterterm-ssh = { path = "../laterterm-ssh" }
anyhow.workspace = true
parking_lot.workspace = true
flume.workspace = true
notify = "8"
laterterm-xshell.workspace = true
shellexpand = "3.1.2"
laterterm-transfer.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
