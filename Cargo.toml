[workspace]
resolver = "2"
members = ["crates/laterterm-app", "crates/laterterm-config", "crates/laterterm-core", "crates/laterterm-deepin", "crates/laterterm-local", "crates/laterterm-secrets", "crates/laterterm-ssh", "crates/laterterm-termview", "crates/laterterm-transfer", "crates/laterterm-xshell"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["crazykun <jilikun@gmail.com>"]

[workspace.dependencies]
gpui = "0.2.2"
alacritty_terminal = "0.25.1"
portable-pty = "0.9"
anyhow = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ropey = "1"
flume = "0.12"
arboard = { version = "3", features = ["wayland-data-control"] }
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
keyring = "4.2"
# Quake 全局热键走 xdg-desktop-portal GlobalShortcuts。必须 0.11 且关 default
# （default = ["tokio"]）与 gpui 的声明（default-features=false + async-std）对齐，
# 否则 feature 并集会把 zbus 拉成 tokio flavor，独立线程 async_io::block_on 失效；
# 写 0.12 会与 gpui 的 0.11.1 并存双份（lock 里 0.12.3 系 keyring 生态传递引入）。
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
# 供 portal worker 独立线程 block_on 与 race/StreamExt（lock 已有 2.6.0，零新增）。
async-io = "2"
futures-lite = "2"
base64 = "0.23"
flate2 = "1"
md5 = "0.8"
serde_json = "1"
# 检查更新（GitHub /releases/latest）：同步 API 免 async runtime；rustls feature
# 自带 ring provider + webpki-roots 内嵌根证书（见 update_check.rs 模块头注记）。
# 不启 json/gzip：解析走 serde_json 纯函数；不启用时 ureq 不发 Accept-Encoding，
# GitHub 返回 identity，无需解压。
ureq = { version = "3", default-features = false, features = ["rustls"] }
# 回滚搜索正则模式：lock 已含 regex 1.13.1（bindgen/env_filter/gpui_util 等
# 反向依赖引入），直接依赖零新增 crate。正则不自造轮子（同 VT 仿真口径）。
regex = "1"
laterterm-core = { path = "crates/laterterm-core" }
laterterm-local = { path = "crates/laterterm-local" }
laterterm-secrets = { path = "crates/laterterm-secrets" }
laterterm-ssh = { path = "crates/laterterm-ssh" }
laterterm-transfer = { path = "crates/laterterm-transfer" }
laterterm-xshell = { path = "crates/laterterm-xshell" }
laterterm-deepin = { path = "crates/laterterm-deepin" }

[patch.crates-io]
# xattr 0.2.3 引用了新版 libc 已移除的 Linux ENOATTR；Linux 语义等价于 ENODATA。
xattr = { path = "vendor/xattr" }
# gpui 0.2.2 本地副本：携带 Linux 后台任务/帧调度诊断与修复（见 vendor/gpui 内注释）。
gpui = { path = "vendor/gpui" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
