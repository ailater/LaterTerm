[workspace]
resolver = "2"
members = ["crates/laterterm-app", "crates/laterterm-config", "crates/laterterm-core", "crates/laterterm-local", "crates/laterterm-secrets", "crates/laterterm-termview"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["crazykun <jilikun@gmail.com>"]

[workspace.dependencies]
gpui = "0.2.2"
alacritty_terminal = "0.25.1"
portable-pty = "0.9"
anyhow = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ropey = "1"
flume = "0.12"
arboard = { version = "3", features = ["wayland-data-control"] }
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
keyring = "4.2"
laterterm-core = { path = "crates/laterterm-core" }
laterterm-local = { path = "crates/laterterm-local" }
laterterm-secrets = { path = "crates/laterterm-secrets" }

[patch.crates-io]
# xattr 0.2.3 引用了新版 libc 已移除的 Linux ENOATTR；Linux 语义等价于 ENODATA。
xattr = { path = "vendor/xattr" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
