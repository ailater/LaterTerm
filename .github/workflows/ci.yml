# LaterTerm CI 门禁
#
# 口径与 AGENTS.md 一致：
# - fmt --check
# - clippy --workspace --all-targets -D warnings
# - cargo test --workspace --lib --bins
#   （termview 上游遗留 doctest 需 GPUI 运行时，本机/CI 必挂，
#    门禁不含 --doc；见 docs/roadmap.md M1 注记）
#
# GPUI 在 Linux 上链接需要系统库（xkbcommon/wayland/alsa 等）；
# lib/bin 测试不开窗口，无头环境可跑。

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# 同分支新推送取消进行中的旧运行，避免过期红淹没最新结论
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fmt 单独前置快速失败：格式问题 30 秒内出结果，不再拖 2 分钟编译才暴露
  fmt:
    name: fmt --check（快速失败）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-fmt

      - run: cargo fmt --all --check

  gate:
    name: 门禁 (clippy / test / 资源)
    needs: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: clippy

      - name: 安装 GPUI 系统依赖
        run: |
          # runner 到 security.ubuntu.com 的 DNS 曾持续故障（azure 主源可达，
          # 三连红全为拉包失败）：security 源改指 azure 归档，dev headers
          # 同源等价。sources.list（旧格式）与 ubuntu.sources/apt-mirrors.txt
          #（24.04 deb822 与 GitHub 镜像机制）并存，逐个替换、缺文件忽略。
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt; do
            if sudo test -f "$f"; then
              sudo sed -i 's/security\.ubuntu\.com/azure.archive.ubuntu.com/g' "$f"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libxcb1-dev libasound2-dev libudev-dev libfontconfig1-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装图标与打包检查工具
        run: |
          # pyyaml 是 test_workflows.py（yml 契约门禁）的依赖：setup-python
          # 发行版不含它，缺装会在门禁首跑 ModuleNotFoundError，故钉版安装；
          # test_workflows.py 由下方 unittest discover 自动纳入，无需单列执行行
          python -m pip install Pillow==12.3.0 pyyaml==6.0.3
          sudo apt-get install -y --no-install-recommends desktop-file-utils

      - name: 图标与打包资源
        run: |
          python -I script/generate-icons.py --check
          python -I -m unittest discover -s script/tests -v
          desktop-file-validate packaging/linux/laterterm.desktop
          python -I -c 'import pathlib, plistlib; plistlib.loads(pathlib.Path("packaging/macos/Info.plist.in").read_bytes())'

      - name: Windows 图标路径纯逻辑回归
        run: |
          rustc --edition 2024 --test crates/laterterm-app/build.rs -o "$RUNNER_TEMP/laterterm-build-tests"
          "$RUNNER_TEMP/laterterm-build-tests"

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --lib --bins

  windows-check:
    name: Windows 编译检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-windows

      # transfer 在 Windows 仅透明旁路；完整 GUI/SSH/MSVC release 由手动原生工作流验证。
      - name: 编译检查（跨平台核心 crate）
        run: cargo check -p laterterm-core -p laterterm-config -p laterterm-local -p laterterm-secrets -p laterterm-transfer
