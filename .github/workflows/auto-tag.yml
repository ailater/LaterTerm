# LaterTerm auto-tag：版本号变化 → 自动打 tag → 派发 release.yml
#
# 与 LaterMD 同款发版模型（零人工 tag push）：
# - PR 把 Cargo.toml workspace.package.version 提到新值 + CHANGELOG 对应小节
# - 合入 main 且 CI 绿后，本 workflow 自动打 tag 并触发完整发布链
# - 版本号不变地合入不会重复发版
#
# 前提：需要 contents:write（打 tag）+ actions:write（dispatch release）。

name: Auto Tag

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    # 只在 CI 成功后跑；跳过不含 Cargo.toml 变更的合入（纯文档等）
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 钉 CI 验证过的提交（LaterMD auto-tag.yml:46 同款）：默认 checkout
          # 取 main HEAD，并发合入时可能指向比 CI 验证更新的提交
          ref: ${{ github.event.workflow_run.head_sha }}
          # 需要拉全部 tag 做比对
          fetch-depth: 0

      - name: 比对版本号并打 tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 版本读取不依赖字段行序 + SemVer 校验（照抄 LaterMD auto-tag.yml:53-57，
          # 实跑验证过的模式；grep '^version' 在 workspace 字段重排时会静默拿错值。
          # tomllib 需 python3.11+，本 job 跑 ubuntu-latest（3.12+），无 22.04 前提问题）
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Cargo.toml 版本号 $VERSION 不是合法 SemVer,中止" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          echo "Cargo.toml 版本: $VERSION → tag: $TAG"

          # 已有同名 tag = 版本未变，跳过（不重复发版）
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG 已存在，版本未变，跳过"
            exit 0
          fi

          # tag 指向 CI 验证过的提交（上方 head_sha 钉定）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "LaterTerm $TAG"
          git push origin "$TAG"
          echo "已打 tag $TAG"

          # 派发 release workflow
          gh workflow run release.yml --ref "$TAG"
          echo "已 dispatch release.yml @ $TAG"
