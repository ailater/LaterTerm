# LaterTerm release：tag → 三平台构建 → GitHub Release
#
# 由 auto-tag.yml 在版本号变化时自动 dispatch，也可手动 workflow_dispatch / 推 tag 触发。
# 产物：Linux x64 tar.xz + deb + AppImage、macOS 双架构 dmg、Windows zip + msi。
#
# 预演口径（不要对旧 tag dispatch）：workflow_dispatch 按指定 ref 取该 ref 上的
# workflow 文件——对 v0.1.0 这类旧 tag dispatch 只会跑旧 release.yml，验不到新文件；
# 且旧 Release 已存在，末尾 gh release create（无 --clobber 语义）在跑完三平台
# 构建后必失败。正确预演 = 合并后在 main 上推一次性 tag（push: tags 会在 tag ref
# 上取到新文件）；预演重跑前先 `gh release delete <tag> --yes`。

name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Linux x64 构建（tar.xz + deb + AppImage）
    # 钉 ubuntu-22.04：glibc 下限跟随构建机（2.35），压低兼容线；
    # LaterMD 发版链同口径（linux-deb.yml 钉 22.04）。
    # 边界：GPUI vendor 依赖在 22.04 上的编译未经 CI 实跑裁决（ci.yml 门禁一直跑
    # ubuntu-latest）；若首跑编不过，回退 ubuntu-24.04 并在 README/Release 正文声明 glibc 下限。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 22.04 系统 python3 是 3.10，无 tomllib；版本步（tomllib 读版本）由这里提供 3.12
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - name: 安装 GPUI 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libxcb1-dev libasound2-dev libudev-dev libfontconfig1-dev pkg-config \
            desktop-file-utils

      - uses: Swatinem/rust-cache@v2
        with:
          # 镜像从 ubuntu-latest 钉到 22.04，换 key 防旧镜像缓存串味
          key: release-linux-22.04

      - name: 构建
        run: cargo build --release --locked -p laterterm-app --bin laterterm

      - name: 读取版本号（tomllib + SemVer 校验）
        # 不用 grep '^version'：它依赖字段行序，workspace 字段重排会静默拿错值；
        # 本段照抄 LaterMD auto-tag.yml:53-57（实跑验证过的模式）
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Cargo.toml 版本号 $VERSION 不是合法 SemVer，中止" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 打包 tar.xz
        run: |
          mkdir -p laterterm-${VERSION}
          cp target/release/laterterm laterterm-${VERSION}/
          cp README.md laterterm-${VERSION}/
          tar -cJf laterterm-${VERSION}-x86_64-unknown-linux-gnu.tar.xz laterterm-${VERSION}/
          sha256sum laterterm-${VERSION}-x86_64-unknown-linux-gnu.tar.xz > laterterm-${VERSION}-x86_64-unknown-linux-gnu.tar.xz.sha256

      - name: 打包 deb
        # 打包脚本强制绝对路径（package-assets.py absolute_path 对相对路径直接拒绝），
        # $PWD 即 runner 的仓库工作区根；mv 与 --output 父目录配套
        run: |
          python3 -I script/package-assets.py deb \
            --binary "$PWD/target/release/laterterm" \
            --output "$PWD/packaging-staging/deb"
          mv packaging-staging/laterterm_${VERSION}_amd64.deb .
          sha256sum laterterm_${VERSION}_amd64.deb > laterterm_${VERSION}_amd64.deb.sha256

      - name: 打包 AppImage（钉版 linuxdeploy）
        run: |
          # 钉具体 release 版本号，追 latest 会在上游换行为时静默翻车；
          # runner 无 FUSE，脚本内以 --appimage-extract-and-run 运行
          # --binary/--output/--linuxdeploy 均传绝对路径（脚本强制，且脚本会 cd 进输出目录）
          curl -fsSLo linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          bash script/package-appimage.sh \
            --binary "$PWD/target/release/laterterm" \
            --output "$PWD/packaging-staging/appimage" \
            --linuxdeploy "$PWD/linuxdeploy.AppImage" \
            --version "$VERSION"
          mv packaging-staging/appimage/laterterm_${VERSION}_x86_64.AppImage .
          sha256sum laterterm_${VERSION}_x86_64.AppImage > laterterm_${VERSION}_x86_64.AppImage.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          # 用产品名前缀而非裸 *.AppImage：AppImage 步下载的 linuxdeploy.AppImage
          # 构建工具躺工作区，裸后缀会把它当产物捞进 Release（v0.4.0 实发后手工剔除）
          path: |
            laterterm-*.tar.xz
            laterterm_*.deb
            laterterm_*.AppImage
            laterterm*.sha256

  # Windows 交付物 = zip + msi（2026-11-28 msi 接线：WiX v4 CLI 钉版，配方见
  # packaging/windows/laterterm.wxs 头注释）。Windows 编译自 ci.yml windows-check
  # 门禁后已持续验证（agent 平台分派修复），故去掉 continue-on-error——msi 成为
  # 交付物后静默缺平台比挂链更糟。签名占位见 wxs 头注释。
  build-windows:
    name: Windows x64 构建（zip + msi）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # GPUI Windows 构建期要 rc.exe + fxc.exe（配方同 packaging.yml，实跑验证过）
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - name: 定位 fxc
        shell: pwsh
        run: |
          if (-not (Get-Command rc.exe -ErrorAction SilentlyContinue)) { throw 'Windows SDK rc.exe unavailable' }
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe unavailable' }
          "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - name: 读取版本号（tomllib + SemVer 校验）
        # 与 build-linux 同款健壮口径（tomllib 不依赖字段行序）；windows runner
        # 的 python 可用（python3 别名不保证存在）
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Cargo.toml 版本号 $VERSION 不是合法 SemVer，中止" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 构建
        run: cargo build --release -p laterterm-app --bin laterterm

      - name: 打包 zip
        shell: bash
        run: |
          mkdir -p laterterm-${VERSION}
          cp target/release/laterterm.exe laterterm-${VERSION}/
          cp README.md laterterm-${VERSION}/
          7z a -tzip laterterm-${VERSION}-x86_64-pc-windows-msvc.zip laterterm-${VERSION}/
          sha256sum laterterm-${VERSION}-x86_64-pc-windows-msvc.zip > laterterm-${VERSION}-x86_64-pc-windows-msvc.zip.sha256

      - name: 打包 msi（WiX v4 CLI，钉版）
        shell: bash
        # 配方 = wxs 头注释接线三步；wix 钉具体版本（追 latest 会在上游换
        # 行为时静默翻车，同 linuxdeploy 口径）。runner 预装 .NET SDK，
        # wix 工具全局安装后进 PATH。注意 -d 必须与变量名空格分隔：
        # 连写 `-dName=Value` 在 5.0.2 被当位置参数报 WIX0118
        #（BuildCommand case "d" 只从下一个独立参数取值，2026-11-28 实跑踩坑）。
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build -arch x64 \
            -d LaterTermVersion="$VERSION" \
            -d LaterTermExe="$PWD/target/release/laterterm.exe" \
            -d LaterTermIco="$PWD/assets/icons/laterterm.ico" \
            -o "laterterm_${VERSION}_x64.msi" packaging/windows/laterterm.wxs
          sha256sum laterterm_${VERSION}_x64.msi > laterterm_${VERSION}_x64.msi.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            *.zip
            *.msi
            *.sha256

  build-macos:
    name: macOS dmg（尽力而为）
    # macos-14 已被 GitHub 退役（标注 The configuration 'macos-14-arm64-us-default'
    # is not supported，2026-11-14 实测）；双架构靠 rustup targets 交叉编译 +
    # lipo 合一，runner 本机架构无所谓，跟 macos-latest 走。
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos

      # 自签名证书（配方照抄 LaterKey release.yml）：secrets 放 key/cert PEM
      # 的 base64，导入临时 keychain + 信任根，LATERTERM_SIGN_IDENTITY 传给
      # package-assets.py——TCC 按签名身份记账，跨版本升级不用重新授权
      # 辅助功能/完全磁盘访问。未配置 secret 时 warning 退回 ad-hoc。
      - name: 导入签名证书（自签名，跨版本稳定 TCC 身份）
        env:
          LATERTERM_SIGN_KEY_PEM_B64: ${{ secrets.LATERTERM_SIGN_KEY_PEM_B64 }}
          LATERTERM_SIGN_CERT_PEM_B64: ${{ secrets.LATERTERM_SIGN_CERT_PEM_B64 }}
        run: |
          if [ -z "$LATERTERM_SIGN_KEY_PEM_B64" ]; then
            echo "::warning::未配置签名证书 secret，退回 ad-hoc 签名（升级需重新授权一次）"
            exit 0
          fi
          echo "$LATERTERM_SIGN_KEY_PEM_B64" | base64 -d > "$RUNNER_TEMP/laterterm-key.pem"
          echo "$LATERTERM_SIGN_CERT_PEM_B64" | base64 -d > "$RUNNER_TEMP/laterterm-cert.pem"
          security create-keychain -p laterterm-build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p laterterm-build build.keychain
          security import "$RUNNER_TEMP/laterterm-key.pem" -k build.keychain -T /usr/bin/codesign
          security import "$RUNNER_TEMP/laterterm-cert.pem" -k build.keychain -T /usr/bin/codesign
          # 构建（fat LTO）可能超过 keychain 默认 5 分钟自动上锁，禁用兜底
          security set-keychain-settings -t 43200 build.keychain
          # 自签名根必须进信任域，codesign 才认这个身份
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k build.keychain "$RUNNER_TEMP/laterterm-cert.pem"
          security set-key-partition-list -S apple-tool:,apple: -k laterterm-build build.keychain
          rm -f "$RUNNER_TEMP/laterterm-key.pem"
          echo "LATERTERM_SIGN_IDENTITY=LaterTerm" >> "$GITHUB_ENV"
          echo "LATERTERM_SIGN_KEYCHAIN=$HOME/Library/Keychains/build.keychain" >> "$GITHUB_ENV"

      - name: 构建双架构
        run: |
          cargo build --release -p laterterm-app --bin laterterm --target aarch64-apple-darwin
          cargo build --release -p laterterm-app --bin laterterm --target x86_64-apple-darwin

      - name: lipo 合一
        run: |
          # 产物落绝对路径：下游组装 .app 的脚本强制 --binary 绝对路径
          lipo -create \
            -output "$PWD/laterterm-universal" \
            target/x86_64-apple-darwin/release/laterterm \
            target/aarch64-apple-darwin/release/laterterm
          lipo -archs "$PWD/laterterm-universal" | tee /dev/stderr | grep -q x86_64
          lipo -archs "$PWD/laterterm-universal" | tee /dev/stderr | grep -q arm64

      - name: 清理构建产物腾磁盘
        run: |
          rm -rf target/aarch64-apple-darwin/release
          rm -rf target/x86_64-apple-darwin/release
          df -h /

      - name: 组装 .app（Info.plist @VERSION@ 注入 + icns + 签名）
        # script/package-macos.sh → package-assets.py：按 LATERTERM_SIGN_IDENTITY
        # 签名（未配置证书时 ad-hoc）；--binary 传绝对路径（absolute_path 拒绝相对路径）
        run: |
          [ -z "${LATERTERM_SIGN_KEYCHAIN:-}" ] || \
            security unlock-keychain -p laterterm-build "$LATERTERM_SIGN_KEYCHAIN"
          bash script/package-macos.sh --binary "$PWD/laterterm-universal" --output "$RUNNER_TEMP/bundle"
          plutil -lint "$RUNNER_TEMP/bundle/LaterTerm.app/Contents/Info.plist"

      - name: 分步组装 dmg
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION_NUM="${VERSION#v}"
          DMG="laterterm-v${VERSION_NUM}-universal2-apple-darwin.dmg"
          # 分步 hdiutil 是防御性对齐 LaterMD macos-dmg.yml:113-128（2026-10-25 踩坑）：
          # 一步式「create 直接挂源目录」按源目录估算镜像容量，xattr/资源叉不计入，
          # LaterMD v0.0.11 两跑炸 No space left；LaterTerm v0.1.0/v0.2.0 一步式跑通属
          # 容量余量运气，改分步消除隐患（非修已观察故障）。固定大小 → 挂载 → ditto
          # 拷入 → 卸载 → convert，每一步可独立归因。
          df -h /System/Volumes/Data || true
          du -sh "$RUNNER_TEMP/bundle/LaterTerm.app" || true
          hdiutil create -size 512m -fs "HFS+" -volname "LaterTerm" \
            -attach -ov "${RUNNER_TEMP}/laterterm-staging.dmg"
          ditto "$RUNNER_TEMP/bundle/LaterTerm.app" "/Volumes/LaterTerm/LaterTerm.app"
          hdiutil detach "/Volumes/LaterTerm"
          hdiutil convert "${RUNNER_TEMP}/laterterm-staging.dmg" \
            -format UDZO -o "$DMG"
          # 代码签名已在「组装 .app」步完成（自签名证书，见证书导入步注记）；
          # Apple 公证（notarytool + stapler）仍待定——需 Apple Developer 账号，
          # 与自签名跨版本 TCC 稳定是两条独立路径。
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal2
          path: |
            *.dmg
            *.sha256

  release:
    name: 创建 Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 收集产物
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.xz" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.zip" -o -name "*.msi" -o -name "*.sha256" \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: 提取 CHANGELOG 小节作为 Release 正文
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # 取 ## v<版本> 到下一个 ## 之间的小节
          awk -v ver="## ${TAG}" '
            $0 ~ "^"ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md || true
          # 兜底：无小节就给一行说明
          if [ ! -s release-notes.md ]; then
            echo "LaterTerm ${TAG}" > release-notes.md
          fi
          # 统一标题头（v0.1.2 手动补过一次，此后自动带）
          {
            echo "# LaterTerm ${TAG}"
            echo
            cat release-notes.md
          } > release-notes.tmp && mv release-notes.tmp release-notes.md

      # gh release create 对已存在 tag 的 Release 会失败（无 --clobber 语义）：
      # 预演/重跑前先 `gh release delete <tag> --yes`；头部注释有完整预演口径。
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --title "LaterTerm ${TAG}" \
            --notes-file release-notes.md \
            release-assets/*
  # 自动更新 homebrew-ailater 的 Casks/laterterm.rb（version + dmg sha256），
  # 配方照抄 LaterKey（secrets.AILATER_TAP_TOKEN = crazykun/homebrew-ailater
  # 写权限 token）；未配置时告警跳过，不算失败。产物 hash 取本 Release 的
  # laterterm-v<版本>-universal2-apple-darwin.dmg.sha256（单文件而非 LaterKey
  # 的 SHA256SUMS 汇总——release 收集口径维持 *.sha256 逐件输出）。
  bump-cask:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 检查 tap token（未配置则警告并跳过）
        id: tap-token
        env:
          AILATER_TAP_TOKEN: ${{ secrets.AILATER_TAP_TOKEN }}
        run: |
          if [ -z "$AILATER_TAP_TOKEN" ]; then
            echo "::warning::未配置 secrets.AILATER_TAP_TOKEN，跳过 homebrew-ailater 的 cask 自动更新（需手工改 Casks/laterterm.rb）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 检出 homebrew-ailater
        if: steps.tap-token.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: crazykun/homebrew-ailater
          token: ${{ secrets.AILATER_TAP_TOKEN }}
          ref: master
          path: homebrew-ailater

      - name: 按 Release 的 dmg sha256 更新 cask 并推送
        if: steps.tap-token.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsSL --retry 3 -o dmg.sha256 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/laterterm-v${VERSION}-universal2-apple-darwin.dmg.sha256"
          # sha256 文件内容形如「<hash>  laterterm-v...dmg」，取第一列
          DMG_SHA=$(awk '{ print $1; exit }' dmg.sha256)
          if ! printf '%s\n' "$DMG_SHA" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::dmg.sha256 里没有合法哈希，内容："
            cat dmg.sha256
            exit 1
          fi
          cd homebrew-ailater
          sed -i "s|^  version \".*\"|  version \"${VERSION}\"|" Casks/laterterm.rb
          sed -i "s|^  sha256 \".*\"|  sha256 \"${DMG_SHA}\"|" Casks/laterterm.rb
          # sed 没匹配上不会报错，兜底校验两行确实变成了目标值
          if ! grep -qxF "  version \"${VERSION}\"" Casks/laterterm.rb; then
            echo "::error::sed 后 version 行不是 ${VERSION}，cask 格式可能变了"
            exit 1
          fi
          if ! grep -qxF "  sha256 \"${DMG_SHA}\"" Casks/laterterm.rb; then
            echo "::error::sed 后 sha256 行不是 ${DMG_SHA}，cask 格式可能变了"
            exit 1
          fi
          # 注意：diff --quiet 无改动时返回 1，只能放在 if 条件里，不能裸做收尾
          if git diff --quiet -- Casks/laterterm.rb; then
            echo "cask 已是 ${VERSION}，无实际改动，跳过提交（可能重复发同一 tag）"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/laterterm.rb
          git commit -m "laterterm ${VERSION}"
          git push origin master
